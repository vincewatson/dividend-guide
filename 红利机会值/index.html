<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A股红利机会值</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body style="margin:0">
<script>/* 嵌入模式：站内 iframe 用 ?embed=1，隐藏自带顶栏 */if(/[?&]embed=1\b/.test(location.search))document.documentElement.classList.add("embed")</script>

<style>
/* 视觉对齐「食息指南」站点设计令牌（docs/reference/ui-style-rules.md）：白底、纯黑标题、品牌蓝 #4680FD、直角、无阴影、浅灰细线 rgba(0,0,0,.06)、Arial + PingFang SC、常规字号 14px。
   站点只有浅色版，本页同样固定浅色。版式：顶栏 → 标题 → 结论面板 → 历史机会值图卡 → 核心指标 → 打分参考 → 观察指标 → 说明 */
:root{
  color-scheme:light;
  --brand:#4680FD; --brand-tint:rgba(70,128,253,0.1); --brand-wash:#F0F5FF;
  --ink:#000000; --body:#404040; --muted:#767676; --axis:#737373; --faint:#949494;
  --line-soft:rgba(0,0,0,0.06); --grid:#e5e5e5; --fill:#e5e5e5;
  --base:#15A877; --idx:#949494;
  --up:#dc2626; --down:#059661;
  --font:Arial,-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Helvetica Neue','Microsoft YaHei',sans-serif;
  --fs-2xs:14px; --fs-base:14px; --fs-lg:20px; --fs-xl:22px;   /* 2026-10-08 用户要求：本页 12px 文字统一升为 14px（hint 弹框 12px 为 .hint-tip 硬编码，不受影响）*/
  --pad-row:18px; --pad-row-tb:11px; --content-max:1280px; --page-pad:28px; --r-ctl:6px;
}
*{box-sizing:border-box}
body{background:#ffffff;color:var(--ink);font-family:var(--font);font-size:var(--fs-base);line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit}
html.embed .top-bar{display:none}
.top-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;height:64px;display:flex;align-items:center;background:rgba(255,255,255,0.70);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line-soft);padding-inline:max(var(--page-pad),calc((100% - var(--content-max))/2))}
.brand{display:inline-flex;align-items:center;gap:7px}
.brand svg{width:50px;height:28.7px;display:block}
.brand-name{font-size:16px;font-weight:700;letter-spacing:-0.02em;line-height:1.2}
.brand-tagline{font-size:10px;color:var(--muted);line-height:1.2}
.page{max-width:calc(var(--content-max) + var(--page-pad)*2);margin:0 auto;padding-inline:var(--page-pad);padding-block:24px 12px;display:grid;gap:48px}   /* 2026-10-08 用户要求：各 panel 间距 32→48px（图表/数据密集、原间距偏挤）；底部留 12px 与首页末段一致 */
@media (max-width:767px){.page{padding-inline:14px;gap:34px}.top-bar{height:60px;padding-inline:14px}}
.page>*{min-width:0}
.section-title{font-size:var(--fs-xl);font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1.2}
.section-sub{font-size:var(--fs-base);color:var(--muted);margin:6px 0 0}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:var(--fs-lg);font-weight:700;letter-spacing:-0.02em;margin:0}
.sec-head span{font-size:var(--fs-base);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* 结论面板：沿用站点 .reminder（6px 圆角、浅蓝外框、品牌蓝双晕） */
.reminder{position:relative;overflow:hidden;background:#FBFCFE;border:1px solid #E3EBFC;border-radius:var(--r-ctl);padding:22px 24px}
.reminder::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 0%,rgba(70,128,253,0.11),rgba(70,128,253,0) 42%),radial-gradient(circle at 88% 100%,rgba(70,128,253,0.09),rgba(70,128,253,0) 46%),linear-gradient(135deg,#FBFCFE 0%,#F0F5FF 100%)}
.reminder>*{position:relative}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:0;align-items:stretch}
.hero>div{padding:0 24px;border-left:1px solid rgba(70,128,253,0.16);min-width:0}
.hero>div:first-child{padding-left:0;border-left:0}
.hero>div:last-child{padding-right:0}
@media (max-width:900px){.hero{grid-template-columns:1fr 1fr;row-gap:18px}.hero>div:nth-child(3){padding-left:0;border-left:0}.hero>div{padding:0 0 0 18px}}
@media (max-width:520px){.hero{grid-template-columns:1fr}.hero>div{padding:0!important;border-left:0!important;border-top:1px solid rgba(70,128,253,0.16);padding-top:14px!important}.hero>div:first-child{border-top:0;padding-top:0!important}}
.k{font-size:var(--fs-2xs);color:var(--muted);display:block;margin-bottom:6px}
.big{font-size:56px;line-height:1;font-weight:700;letter-spacing:-0.03em}
.big small{font-size:var(--fs-base);color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:0}
.band-chip{display:inline-block;margin-top:10px;font-size:var(--fs-2xs);font-weight:700;padding:3px 10px}
.v{font-size:var(--fs-lg);font-weight:700;line-height:1.2}
.note{font-size:var(--fs-base);color:var(--body);margin:8px 0 0;line-height:1.6}
.cmp{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:2px}
.cmp b{display:block;font-size:var(--fs-lg);font-weight:700;margin-top:2px}
.cmp small{font-size:var(--fs-2xs);color:var(--muted)}

/* 图卡：对齐站点详情页图表卡 */
.chart-card{padding:0}   /* 2026-10-08 用户要求：取消「历史机会值」面板外框与内边距，使图表与下方各节内容左对齐 */
.chart-header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.chart-title{font-size:var(--fs-lg);font-weight:700;letter-spacing:-0.02em;color:var(--ink)}   /* 2026-10-08 用户要求：字号与「核心指标」(sec-head h2) 一致 */
.chart-update{font-size:var(--fs-2xs);color:var(--axis)}
.chart-legend{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:12px 0 8px}
.legend-items{display:flex;gap:16px;flex-wrap:wrap}
.legend-item{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-2xs);color:var(--axis)}
.legend-line{display:inline-block;width:16px;height:2px}
.range{display:inline-flex;border:1px solid var(--line-soft)}
.range button{font:inherit;font-size:var(--fs-2xs);height:28px;padding:0 12px;border:0;background:transparent;color:#525252;cursor:pointer}
.range button:hover{color:var(--brand)}
.range button[aria-pressed="true"]{background:var(--brand);color:#fff;font-weight:600}
.range button:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.chart-wrap{position:relative}
#chart{display:block;width:100%;height:320px}
@media (max-width:767px){#chart{height:300px}.chart-legend{flex-direction:column;align-items:stretch}.range{width:100%}.range button{flex:1 1 0}}
#tip{position:absolute;top:8px;pointer-events:none;background:#fff;border:1px solid var(--grid);border-radius:6px;box-shadow:0 2px 8px rgba(70,128,253,0.12);padding:8px 10px;font-size:12px;min-width:150px}   /* 2026-10-08 用户要求：图表 hover 弹框与全站弹框统一 12px */
#tip .d{color:var(--faint);margin-bottom:4px}
#tip .r{display:flex;align-items:center;gap:6px;color:#404040}
#tip .r b{margin-left:auto;font-weight:600;color:var(--ink)}
#tip .sw{width:8px;height:8px;display:inline-block}

/* 表格：对齐站点 .index-table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th,td{padding:var(--pad-row-tb) 10px;text-align:left;vertical-align:middle;font-size:var(--fs-base)}
th{background:#fff;color:var(--ink);font-weight:700;box-shadow:inset 0 -1px 0 var(--line-soft)}
td{border-bottom:1px solid var(--line-soft);color:var(--ink)}
th.col-num,td.col-num{text-align:right}
td.muted{color:var(--muted)}
tr.now td{background:var(--brand-wash)}
.tag{display:inline-block;font-size:var(--fs-2xs);padding:3px 10px;margin:1px 6px 1px 0;background:var(--fill);color:var(--muted);font-weight:500;white-space:nowrap}
.tag.up{background:var(--brand-tint);color:var(--brand);font-weight:600}
.tag.dn{background:var(--brand-tint);color:var(--up);font-weight:600}
.tag.rel{background:var(--brand-tint);color:var(--muted);font-weight:600}
.scorebar{display:flex;align-items:center;gap:10px;min-width:160px}
.scorebar .track{position:relative;flex:1;height:4px;background:var(--grid)}
.scorebar .track i{position:absolute;top:0;bottom:0;left:0}
.scorebar .track::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--axis)}
.scorebar b{width:2em;text-align:right;font-weight:700}
.sw2{display:inline-block;width:8px;height:8px;margin-right:8px}
.hint{position:relative;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:6px;border-radius:50%;border:1px solid #949494;background:#fff;color:#767676;font:italic 700 11px/1 Georgia,'Times New Roman',serif;cursor:help;vertical-align:middle;padding:0}
.hint:hover,.hint:focus-visible{border-color:var(--brand);color:var(--brand);outline:none}
.hint-tip{position:absolute;left:-10px;bottom:calc(100% + 8px);width:max-content;max-width:min(300px,calc(100vw - 150px));background:#fff;border:1px solid var(--grid);border-radius:6px;box-shadow:0 2px 8px rgba(70,128,253,0.12);padding:8px 10px;font:400 12px/1.6 var(--font);color:#404040;text-align:left;white-space:normal;visibility:hidden;opacity:0;transition:opacity .12s;z-index:5;pointer-events:none}
.hint:hover .hint-tip,.hint:focus .hint-tip,.hint[aria-expanded="true"] .hint-tip{visibility:visible;opacity:1}
@media (prefers-reduced-motion:reduce){.hint-tip{transition:none}}
.sec-head h2{display:inline-flex;align-items:center}
.notes{margin:0;padding-left:1.5em;font-size:var(--fs-base);color:var(--body);line-height:1.7}   /* 2026-10-08 用户要求：底部「指标说明」独立为 20px 标题 panel + 有序列表 */
.notes>li{margin-top:10px}
.notes>li:first-child{margin-top:0}
.notes ul{margin:8px 0 0;padding-left:1.2em;list-style:disc}
.notes ul li{margin-top:6px;color:var(--muted)}
.notes ul li b{color:var(--body);font-weight:600}
</style>

<header class="top-bar">
  <a class="brand" href="/" style="text-decoration:none;color:inherit">
    <svg viewBox="25.6 123.8 460.8 264.4" aria-hidden="true"><defs><linearGradient id="bR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DC2626"/><stop offset="1" stop-color="#E87272"/></linearGradient><linearGradient id="bB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4680FD"/><stop offset="1" stop-color="#87ACFE"/></linearGradient></defs><circle cx="157.8" cy="256" r="132.2" fill="url(#bR)"/><circle cx="354.2" cy="256" r="132.2" fill="url(#bB)"/></svg>
    <span><span class="brand-name">食息指南</span><br><span class="brand-tagline">低利率时代的理财之道</span></span>
  </a>
</header>

<main class="page">
  <div>
    <h1 class="section-title">A股红利机会值</h1>
    <p class="section-sub" id="sub"></p>
  </div>

  <section class="reminder" aria-label="当前结论">
    <div class="hero">
      <div>
        <span class="k">红利机会值</span>
        <div class="big num" id="score"></div>
        <span class="band-chip" id="band"></span>
      </div>
      <div>
        <span class="k">当前建议</span>
        <div class="v" id="advice"></div>
        <p class="note" id="summary"></p>
      </div>
      <div>
        <span class="k">适用周期</span>
        <div class="v" id="horizon"></div>
        <p class="note" id="horizonNote"></p>
      </div>
      <div>
        <span class="k">历史对比</span>
        <div class="cmp num" id="cmp"></div>
      </div>
    </div>
  </section>

  <section>
    <div class="chart-card">
      <div class="chart-header"><span class="chart-title" style="display:inline-flex;align-items:center">历史机会值<button type="button" class="hint" aria-label="说明" aria-describedby="h-chart">i<span class="hint-tip" role="tooltip" id="h-chart">机会值以50为中性值：高于50说明机会多于平常，低于50说明机会少于平常。灰线为中证红利价格指数，对应右轴。</span></button></span><span class="chart-update" id="upd"></span></div>
      <div class="chart-legend">
        <div class="legend-items">
          <span class="legend-item"><i class="legend-line" style="background:var(--brand)"></i>红利机会值</span>
          <span class="legend-item"><i class="legend-line" style="background:var(--idx)"></i>中证红利指数（右轴）</span>
          <span class="legend-item"><i class="legend-line" style="background:var(--ink);height:1px"></i>50=中性值</span>
        </div>
        <div class="range" role="group" aria-label="时间区间">
          <button type="button" data-y="1">近1年</button><button type="button" data-y="3" aria-pressed="true">近3年</button><button type="button" data-y="0">2018年以来</button>
        </div>
      </div>
      <div class="chart-wrap"><svg id="chart" role="img" aria-label="红利机会值与中证红利指数走势"></svg><div id="tip" hidden></div></div>
    </div>
  </section>

  <section>
    <div class="sec-head"><h2>核心指标<button type="button" class="hint" aria-label="说明" aria-describedby="h-core">i<span class="hint-tip" role="tooltip" id="h-core">每项指标先换算成0–100的机会分：50为中性值，越高越有利。权重为该指标在机会值中的占比。</span></button></h2></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>指标</th><th>最新值</th><th>机会分</th><th class="col-num">权重</th><th>适合判断</th></tr></thead>
      <tbody id="core"></tbody></table></div>
  </section>

  <section>
    <div class="sec-head"><h2>打分参考<button type="button" class="hint" aria-label="说明" aria-describedby="h-bands">i<span class="hint-tip" role="tooltip" id="h-bands">2018年以来每个月末的机会值，按区间分组，统计之后12个月中证红利全收益指数的表现。</span></button></h2></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>机会值</th><th>建议</th><th class="col-num">月数</th><th class="col-num">未来12个月平均</th><th class="col-num">上涨概率</th><th class="col-num">期间平均最大浮亏</th></tr></thead>
      <tbody id="bands"></tbody></table></div>
  </section>

  <section>
    <div class="sec-head"><h2>观察指标<button type="button" class="hint" aria-label="说明" aria-describedby="h-obs">i<span class="hint-tip" role="tooltip" id="h-obs">这些指标对未来行情的预测力不足，不计入机会值，但适合用来解释当前行情。</span></button></h2></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>指标</th><th>最新值</th><th>指标说明</th></tr></thead>
      <tbody id="obs"></tbody></table></div>
  </section>

  <section>
    <div class="sec-head"><h2>指标说明</h2></div>
    <ol class="notes">
      <li>本页数据基于Wind数据计算，可能存在错漏或误导，请勿作为投资依据。</li>
      <li id="noteMethod"></li>
      <li>核心指标包含4项，全部计入机会值计算。<ul id="noteCore"></ul></li>
      <li>观察指标包含4项，不计入机会值。<ul id="noteObs"></ul></li>
    </ol>
  </section>
</main>

<script src="data/opportunity.js?v=20261008"></script><!-- v: 数据缓存串，数据更新/部署时改（避免浏览器按默认 max-age 缓存旧数据，2026-10-08）-->
<script>
/* 数据来自 data/opportunity.js（由 engine/opportunity_engine.py 生成），页面不写死任何数字 */
const DATA = window.DIVIDEND_OPPORTUNITY;
if(!DATA){document.querySelector('.page').innerHTML='<p style="padding:40px 0;color:#767676">数据文件 data/opportunity.js 未加载。</p>';throw new Error('no data');}
const BANDS=[[80,100,"机会很多","积极加仓"],[60,80,"机会较多","加仓"],[40,60,"中性","持有"],[20,40,"机会偏少","暂停加仓"],[0,20,"机会很少","减仓"]];
const JUDGE={up:["up","上行空间"],dn:["dn","下行风险"],rel:["rel","相对全A"]};
const C={brand:"#4680FD",red:"#dc2626",idx:"#949494",grid:"#e5e5e5",axis:"#737373",ink:"#000000"};
const $=id=>document.getElementById(id);
const r0=v=>Math.round(v);
const bandOf=v=>BANDS.find(b=>v>=b[0]&&(v<b[1]||b[1]===100));
const colorOf=v=>v>=60?C.brand:(v>=40?C.ink:C.red);
function render(){
  const s=r0(DATA.score), b=bandOf(s);
  $('sub').textContent='参照指数：'+DATA.index.replace(/([\u4e00-\u9fa5])(\d)/,'$1 $2')+' · 数据截至'+DATA.asof+' · 本页信息仅供交流学习之用，不作为投资建议';
  $('upd').textContent=`更新于${DATA.asof}`;
  $('score').innerHTML=`${s}<small>/100</small>`; $('score').style.color=colorOf(s);
  const chip=$('band'); chip.textContent=`${b[0]}–${b[1]} · ${b[2]}`;
  chip.style.background='rgba(70,128,253,0.1)'; chip.style.color=colorOf(s);
  $('advice').textContent=b[3]; $('summary').textContent=DATA.summary;
  $('horizon').textContent=DATA.horizon; $('horizonNote').textContent=DATA.horizonNote;
  $('cmp').innerHTML=Object.entries(DATA.compare).map(([k,v])=>`<div><small>${k}</small><b style="color:${colorOf(r0(v))}">${r0(v)}</b></div>`).join('');
  $('core').innerHTML=DATA.core.map(c=>`<tr><td><b>${c.name}</b></td><td class="num">${c.value}</td><td><div class="scorebar"><div class="track"><i style="width:${c.score}%;background:${c.score>=50?C.brand:C.red}"></i></div><b class="num">${r0(c.score)}</b></div></td><td class="col-num num">${c.weight}%</td><td>${c.judge.map(j=>`<span class="tag ${JUDGE[j][0]}">${JUDGE[j][1]}</span>`).join('')}</td></tr>`).join('');
  $('bands').innerHTML=BANDS.map((d,i)=>{const r=DATA.bands[4-i], now=d===b, col=d[0]>=60?C.brand:(d[0]>=40?'#949494':C.red);
    return `<tr class="${now?'now':''}"><td><span class="sw2" style="background:${col}"></span>${d[0]}–${d[1]}${now?'（当前）':''}</td><td>${d[2]} · ${d[3]}</td><td class="col-num num">${r[0]}</td><td class="col-num num" style="color:${r[1]>=0?'#dc2626':'#059661'}">${r[1]>=0?'+':'−'}${Math.abs(r[1]).toFixed(1)}%</td><td class="col-num num">${r[2]}%</td><td class="col-num num">−${Math.abs(r[3]).toFixed(1)}%</td></tr>`}).join('');
  $('obs').innerHTML=DATA.observe.map(o=>`<tr><td><b>${o.name}</b></td><td class="num">${o.value}</td><td class="muted">${o.note}</td></tr>`).join('');
  $('noteMethod').textContent=DATA.method;
  $('noteCore').innerHTML=DATA.core.map(c=>`<li><b>${c.name}</b>：${c.calc||''}</li>`).join('');
  $('noteObs').innerHTML=DATA.observe.map(o=>`<li><b>${o.name}</b>：${o.calc||''}</li>`).join('');
}
let years=3;
function slice(){const S=DATA.series; if(!years) return S; const last=new Date(S.d[S.d.length-1]); const from=new Date(last); from.setFullYear(last.getFullYear()-years);
  let i=S.d.findIndex(d=>new Date(d)>=from); if(i<0) i=0; return {d:S.d.slice(i),v:S.v.slice(i),p:S.p.slice(i)};}
function draw(){
  const svg=$('chart'), tip=$('tip'), S=slice(), n=S.v.length;
  const W=svg.clientWidth||900, H=svg.clientHeight||320, m={l:34,r:56,t:14,b:26}, iw=W-m.l-m.r, ih=H-m.t-m.b;
  const t0=+new Date(S.d[0]), t1=+new Date(S.d[n-1]), x=i=>m.l+(+new Date(S.d[i])-t0)/(t1-t0)*iw, y=v=>m.t+(1-v/100)*ih;
  const pmin=Math.min(...S.p), pmax=Math.max(...S.p), st=pmax-pmin>1500?500:250, lo=Math.floor(pmin/st)*st, hi=Math.ceil(pmax/st)*st, yp=v=>m.t+(1-(v-lo)/(hi-lo))*ih;
  const F='Arial,"Helvetica Neue",Helvetica,sans-serif';
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  let s=`<defs><clipPath id="ab"><rect x="${m.l}" y="${m.t}" width="${iw}" height="${y(50)-m.t}"/></clipPath><clipPath id="be"><rect x="${m.l}" y="${y(50)}" width="${iw}" height="${m.t+ih-y(50)}"/></clipPath></defs>`;
  [0,20,40,60,80,100].forEach(v=>{s+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y(v)}" y2="${y(v)}" stroke="${C.grid}" stroke-dasharray="${v===20||v===80?'4 4':''}"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end" font-size="14" font-family='${F}' fill="${C.axis}">${v}</text>`});
  [lo,hi].forEach(v=>{s+=`<text x="${m.l+iw+8}" y="${yp(v)+4}" font-size="14" font-family='${F}' fill="${C.idx}">${v}</text>`});
  const ticks=5; for(let k=0;k<ticks;k++){const tt=t0+(t1-t0)*k/(ticks-1), dt=new Date(tt), lab=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`, xx=m.l+(tt-t0)/(t1-t0)*iw;
    s+=`<text x="${xx}" y="${H-6}" text-anchor="${k===0?'start':(k===ticks-1?'end':'middle')}" font-size="14" font-family='${F}' fill="${C.axis}">${lab}</text>`}
  const pts=S.v.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' '), area=`${m.l},${y(50)} ${pts} ${x(n-1)},${y(50)}`;
  s+=`<polygon points="${area}" fill="${C.brand}" fill-opacity="0.14" clip-path="url(#ab)"/><polygon points="${area}" fill="${C.brand}" fill-opacity="0.06" clip-path="url(#be)"/>`;
  s+=`<polyline points="${S.p.map((v,i)=>`${x(i).toFixed(1)},${yp(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${C.idx}" stroke-width="1.2" stroke-linejoin="round"/>`;
  s+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y(50)}" y2="${y(50)}" stroke="${C.ink}" stroke-width="1"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="${C.brand}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const lv=S.v[n-1]; s+=`<circle cx="${x(n-1)}" cy="${y(lv)}" r="4.5" fill="${C.brand}" stroke="#fff" stroke-width="2"/>`;
  s+=`<line id="hl" y1="${m.t}" y2="${m.t+ih}" stroke="${C.axis}" stroke-dasharray="3 3" visibility="hidden"/><circle id="hd" r="4" fill="${C.brand}" stroke="#fff" stroke-width="2" visibility="hidden"/>`;
  svg.innerHTML=s;
  svg.onpointermove=e=>{const r=svg.getBoundingClientRect(), px=(e.clientX-r.left)*(W/r.width); let i=0,best=1e9; for(let k=0;k<n;k++){const dd=Math.abs(x(k)-px); if(dd<best){best=dd;i=k}}
    const hl=svg.querySelector('#hl'), hd=svg.querySelector('#hd'); hl.setAttribute('x1',x(i)); hl.setAttribute('x2',x(i)); hl.setAttribute('visibility','visible'); hd.setAttribute('cx',x(i)); hd.setAttribute('cy',y(S.v[i])); hd.setAttribute('visibility','visible');
    tip.hidden=false; tip.innerHTML=`<div class="d">${S.d[i]}</div><div class="r"><span class="sw" style="background:${C.brand}"></span>红利机会值<b>${r0(S.v[i])}</b></div><div class="r"><span class="sw" style="background:${C.idx}"></span>中证红利<b>${S.p[i]}</b></div>`;
    const tx=x(i)/W*r.width; tip.style.left=(tx>r.width/2? tx-tip.offsetWidth-12 : tx+12)+'px'};
  svg.onpointerleave=()=>{tip.hidden=true; svg.querySelector('#hl')?.setAttribute('visibility','hidden'); svg.querySelector('#hd')?.setAttribute('visibility','hidden')};
}
document.querySelectorAll('.range button').forEach(b=>b.addEventListener('click',()=>{years=+b.dataset.y; document.querySelectorAll('.range button').forEach(o=>o.setAttribute('aria-pressed',String(o===b))); draw()}));
document.querySelectorAll('.hint').forEach(h=>{h.setAttribute('aria-expanded','false');h.addEventListener('click',e=>{e.stopPropagation();const o=h.getAttribute('aria-expanded')==='true';document.querySelectorAll('.hint').forEach(x=>x.setAttribute('aria-expanded','false'));h.setAttribute('aria-expanded',String(!o))})});
document.addEventListener('click',()=>document.querySelectorAll('.hint').forEach(x=>x.setAttribute('aria-expanded','false')));
render(); draw(); addEventListener('resize',draw);
</script>

<script>/* 嵌入模式：把页面高度告诉父页面，父页面据此设置 iframe 高度 */
(function(){if(!document.documentElement.classList.contains("embed")||window.parent===window)return;
var last=0;function post(){var h=Math.ceil(document.documentElement.scrollHeight);if(h!==last){last=h;window.parent.postMessage({type:"dividend-opportunity:height",height:h},"*")}}
if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);window.addEventListener("load",post);post();})();
