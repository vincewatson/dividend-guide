<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>移动端筛选器原型 · 食息指南</title>
<!--
  食息指南 · 移动端筛选器改版「原型」（2026-10-03）
  目的：把「红利指数浏览器」页面的移动端筛选器，从「常驻展开」改为「漏斗按钮 + 底部弹出面板」。
  参考：豆瓣 App 的筛选器（折叠态只留漏斗图标；展开态为底部面板：区块标题 + 胶囊标签 + 固定取消/确定）。
  说明：① 纯静态原型，未上线、未接入站点；② 数据取自 data/indexData.json 的 49 条真实指数；
        ③ 顶部「原型」小条可切换 新版 / 旧版 对照，正式上线时该小条与本文件都会移除。
-->
<style>
  :root{
    --blue:#4680FD;
    --ink:#000;
    --ink2:#404040;
    --gray:#767676;
    --gray2:#949494;
    --line:rgba(0,0,0,0.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:Arial,-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    color:#000;background:#F5F5F5;font-size:14px;line-height:1.5;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;box-shadow:0 0 24px rgba(0,0,0,.06)}

  /* ---------- 原型专属小条（正式上线删除） ---------- */
  .proto-bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#FBFBFE;border-bottom:1px solid var(--line);font-size:12px;color:var(--gray);position:sticky;top:0;z-index:30}
  .proto-tag{background:var(--blue);color:#fff;font-size:11px;font-weight:700;padding:2px 6px;letter-spacing:.04em}
  .seg{display:flex;margin-left:auto}
  .seg-btn{border:1px solid var(--line);background:#fff;color:#525252;font-size:12px;padding:5px 10px;cursor:pointer;font-family:inherit}
  .seg-btn+.seg-btn{border-left:0}
  .seg-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}

  /* ---------- 顶栏 ---------- */
  .topbar{height:49px;display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:#fff}
  .brand{font-size:14px;font-weight:700;color:#000}

  /* ---------- 内容 ---------- */
  .page{padding:18px 14px 60px}
  .section-title{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
  .section-sub{font-size:13px;color:var(--gray);margin-bottom:12px}

  /* 工具栏：左计数 + 右「漏斗 + 筛选器」 */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
  .tb-count{font-size:13px;color:var(--gray)}
  .tb-count b{color:#000;font-weight:700}
  .filter-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:#525252;
    font-size:14px;font-weight:600;padding:7px 12px;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .filter-btn svg{width:16px;height:16px;display:block}
  .filter-btn.active{border-color:var(--blue);color:var(--blue)}
  .filter-btn .badge{display:none;min-width:16px;height:16px;padding:0 4px;background:var(--blue);color:#fff;font-size:11px;
    font-weight:700;line-height:16px;text-align:center}
  .filter-btn.active .badge{display:inline-block}

  /* ---------- 列表 ---------- */
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
  .row .n{font-size:14px;color:#000}
  .row .c{font-size:12px;color:var(--gray2);margin-top:2px}
  .row .y{font-size:14px;font-weight:700;color:#000;text-align:right}
  .row .d{font-size:12px;margin-top:2px;text-align:right}
  .up{color:#DC2626}.down{color:#059661}.flat{color:var(--gray2)}
  .empty{padding:48px 0;text-align:center;color:var(--gray2)}

  /* ---------- 旧版：常驻展开（站点现状，移动端） ---------- */
  .old-tagbar{display:none;padding:18px 0;margin-bottom:10px;background:#fff}
  body.mode-old .old-tagbar{display:block}
  body.mode-old .toolbar{display:none}
  .old-row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .old-group{display:flex;align-items:center;width:72px;min-width:72px;flex-shrink:0;white-space:nowrap;
    font-size:14px;color:var(--gray);font-weight:600}
  .old-scroll{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;overflow-x:auto;scrollbar-width:none;
    flex:1;min-width:0;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .old-scroll::-webkit-scrollbar{display:none}
  .old-tag{flex-shrink:0;white-space:nowrap;min-height:36px;display:inline-flex;align-items:center;
    border:1px solid var(--line);background:#fff;color:#525252;font-size:14px;padding:4px 12px;
    cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .old-tag.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .old-reset{border:0;background:none;color:var(--gray);font-size:14px;cursor:pointer;padding:4px 2px;
    font-family:inherit;min-height:36px}

  /* ---------- 新版：底部弹出面板 ---------- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;visibility:hidden;transition:opacity .25s ease;z-index:40}
  .mask.open{opacity:1;visibility:visible}
  .sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:#fff;z-index:50;
    transform:translateY(101%);transition:transform .28s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column;max-height:86vh;box-shadow:0 -8px 30px rgba(0,0,0,.12)}
  .sheet.open{transform:translateY(0)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
  .sheet-head h2{margin:0;font-size:16px;font-weight:700}
  .sheet-close{border:0;background:none;font-size:18px;line-height:1;color:var(--gray);cursor:pointer;padding:4px 2px;font-family:inherit}
  .sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 16px 10px}
  .fgroup{padding:14px 0}
  .fgroup+.fgroup{border-top:1px solid var(--line)}
  .fgroup-title{font-size:15px;font-weight:600;color:#000;margin:0 0 10px}
  .fchips{display:flex;flex-wrap:wrap;gap:10px}
  .fchip{border:1px solid var(--line);background:#fff;color:#525252;font-size:14px;font-family:inherit;
    padding:5px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .fchip i{font-style:normal;font-size:11px;color:var(--gray2);margin-left:5px}
  .fchip.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .fchip.active i{color:rgba(255,255,255,.85)}
  .sheet-foot{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .sheet-foot button{flex:1;height:52px;border:0;background:#fff;font-size:15px;font-family:inherit;cursor:pointer}
  .sf-cancel{color:#525252}
  .sf-ok{color:var(--blue);font-weight:700;border-left:1px solid var(--line)}
</style>
</head>

</div>

<!-- 新版：底部弹出面板 -->
<div class="mask" id="mask"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="筛选">

  </div>
</div>

  ]},
  { key:'adjust', label:'调仓频率', field:'adjustCycle', tags:[
    { id:'quarter', label:'季度', test:function(a){ return a === '季度'; } },
    { id:'half',    label:'半年', test:function(a){ return a === '半年'; } },
    { id:'year',    label:'一年', test:function(a){ return a === '一年'; } }
  ]},
  { key:'publisher', label:'指数公司', field:'publisher', tags:[
    { id:'sp',      label:'标普道琼斯',   test:function(p){ return /标普/.test(p); } },
    { id:'csi',     label:'中证指数',     test:function(p){ return /中证/.test(p); } },
    { id:'cnindex', label:'国证指数',     test:function(p){ return /国证/.test(p); } },
    { id:'hsi',     label:'恒生指数',     test:function(p){ return /恒生/.test(p); } },
    { id:'cninfo',  label:'华证指数',     test:function(p){ return /华证/.test(p); } },
    { id:'xinhua',  label:'新华指数',     test:function(p){ return /新华/.test(p); } },
    { id:'ccx',     label:'中诚信指数',   test:function(p){ return /中诚信/.test(p); } },
    { id:'ctcs',    label:'中华交易服务', test:function(p){ return /中华交易/.test(p); } }
  ]}
];

/* ===== 状态 ===== */
var state = { theme:'', market:'', adjust:'', publisher:'' };   // 已生效
var draft = null;                                               // 面板内草稿

var $ = function(id){ return document.getElementById(id); };
var countText = $('countText'), filterBadge = $('filterBadge'), filterBtn = $('filterBtn');
var listEl = $('list'), oldTagbar = $('oldTagbar');
var sheet = $('sheet'), mask = $('mask'), sheetBody = $('sheetBody');

function groupOf(k){ for (var i=0;i<GROUPS.length;i++) if (GROUPS[i].key===k) return GROUPS[i]; return null; }
function tagOf(k,t){ var g=groupOf(k); if(!g) return null; for (var i=0;i<g.tags.length;i++) if (g.tags[i].id===t) return g.tags[i]; return null; }
function rowMatch(r,k,t){ var g=groupOf(k), tg=tagOf(k,t); if(!g||!tg) return false; return !!tg.test(r[g.field]); }

/* sel 下、忽略 exceptKey 组，r 是否通过 */
function passes(r, sel, exceptKey){
  for (var i=0;i<GROUPS.length;i++){
    var g=GROUPS[i];
    if (exceptKey && g.key===exceptKey) continue;
    var s=sel[g.key];
    if (!s) continue;
    if (!rowMatch(r, g.key, s)) return false;
  }
  return true;
}
/* 某组某标签（t='' 表示「全部」）在当前草稿下的数量 */
function countFor(sel, k, t){
  var n=0;
  for (var i=0;i<ROWS.length;i++){
    var r=ROWS[i];
    if (!passes(r, sel, k)) continue;
    if (t && !rowMatch(r, k, t)) continue;
    n++;
  }
  return n;
}

function fmtPct(v){
  if (v===''||v===null||v===undefined||isNaN(v)) return '—';
  var n=Number(v);
  return (n>0?'+':'')+n.toFixed(2)+'%';
}
function rowHtml(r){
  var dc=r.dailyChange;
  var cls=(typeof dc==='number'&&dc>0)?'up':((typeof dc==='number'&&dc<0)?'down':'flat');
  return '<div class="row">'
    + '<div><div class="n">'+r.name+'</div><div class="c">'+r.code+' · '+r.market+'</div></div>'
    + '<div><div class="y">'+(r.yield||'—')+'</div><div class="d '+cls+'">'+(dc==null?'—':fmtPct(dc))+'</div></div>'
    + '</div>';
}

function activeCount(sel){ var n=0; for (var k in sel){ if (sel[k]) n++; } return n; }

function render(){
  var items=ROWS.filter(function(r){ return passes(r, state); });
  countText.innerHTML = '共 <b>'+items.length+'</b> 只';
  var n=activeCount(state);
  filterBadge.textContent = n;
  filterBtn.classList.toggle('active', n>0);
  listEl.innerHTML = items.length ? items.map(rowHtml).join('') : '<div class="empty">没有符合条件的指数</div>';
  if (document.body.classList.contains('mode-old')) renderOld();
}

/* ---------- 旧版：常驻展开 ---------- */
function renderOld(){
  var h='';
  GROUPS.forEach(function(g){
    h+='<div class="old-row"><span class="old-group">'+g.label+'</span><div class="old-scroll">';
    g.tags.forEach(function(t){
      var on = state[g.key]===t.id?' active':'';
      h+='<button class="old-tag'+on+'" data-g="'+g.key+'" data-t="'+t.id+'">'+t.label+'</button>';
    });
    h+='</div></div>';
  });
  h+='<div class="old-row"><button class="old-reset" type="button" data-reset="1">✕ 清除筛选</button></div>';
  oldTagbar.innerHTML=h;
}
oldTagbar.addEventListener('click', function(e){
  var b=e.target.closest('button'); if(!b) return;
  if (b.dataset.reset){ state={theme:'',market:'',adjust:'',publisher:''}; render(); return; }
  var k=b.dataset.g, t=b.dataset.t;
  state[k] = (state[k]===t) ? '' : t;   /* 再点一次取消 */
  render();
});

/* ---------- 新版：底部面板 ---------- */
function renderSheet(){
  var h='';
  GROUPS.forEach(function(g){
    h+='<div class="fgroup"><div class="fgroup-title">'+g.label+'</div><div class="fchips">';
    h+='<button class="fchip'+(!draft[g.key]?' active':'')+'" data-g="'+g.key+'" data-t="">全部<i>'+countFor(draft,g.key,'')+'</i></button>';
    g.tags.forEach(function(t){
      var on = draft[g.key]===t.id?' active':'';
      h+='<button class="fchip'+on+'" data-g="'+g.key+'" data-t="'+t.id+'">'+t.label+'<i>'+countFor(draft,g.key,t.id)+'</i></button>';
    });
    h+='</div></div>';
  });
  sheetBody.innerHTML=h;
}
sheetBody.addEventListener('click', function(e){
  var b=e.target.closest('.fchip'); if(!b) return;
  var k=b.dataset.g, t=b.dataset.t;
  draft[k] = (draft[k]===t) ? '' : t;   /* 单选；点「全部」或再点已选项 = 取消该组 */
  renderSheet();
});

function openSheet(){
  draft = { theme:state.theme, market:state.market, adjust:state.adjust, publisher:state.publisher };
  renderSheet();
  mask.classList.add('open'); sheet.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSheet(){
  mask.classList.remove('open'); sheet.classList.remove('open');
  document.body.style.overflow='';
}
filterBtn.addEventListener('click', openSheet);
$('sheetClose').addEventListener('click', closeSheet);
$('btnCancel').addEventListener('click', closeSheet);
mask.addEventListener('click', closeSheet);
$('btnOk').addEventListener('click', function(){
  state = { theme:draft.theme, market:draft.market, adjust:draft.adjust, publisher:draft.publisher };
  closeSheet(); render();
});

/* ---------- 新版 / 旧版 切换 ---------- */
document.querySelector('.seg').addEventListener('click', function(e){
  var b=e.target.closest('.seg-btn'); if(!b) return;
  document.querySelectorAll('.seg-btn').forEach(function(x){ x.classList.toggle('active', x===b); });
  var mode=b.dataset.mode;
  document.body.classList.toggle('mode-old', mode==='old');
  document.body.classList.toggle('mode-new', mode==='new');
  render();
});

/* ---------- 初始 ---------- */
render();
</script>
</body>
</html>
