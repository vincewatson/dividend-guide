<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>红利机会卡 · 样式预览</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,-apple-system,'PingFang SC','Helvetica Neue',sans-serif;background:#eef1f6;color:#111;padding:28px 18px 60px}
h1{font-size:20px;margin-bottom:6px}
.lede{color:#5b6472;font-size:13px;line-height:1.7;margin-bottom:22px}
.lede code{background:#fff;border:1px solid #e2e6ee;border-radius:4px;padding:1px 5px;font-size:12px}
.stage{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
figure{width:375px}
figcaption{font-size:13px;font-weight:700;margin-bottom:8px}
figcaption span{display:block;font-weight:400;color:#66707e;font-size:12px;line-height:1.6;margin-top:3px}
.phone{width:375px;border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 12px 32px rgba(20,34,66,.18);border:1px solid rgba(0,0,0,.06)}
.card{width:100%;min-height:720px;display:flex;flex-direction:column}
.k{font-size:11px;color:#8b8b8b;letter-spacing:.02em}
.ch{display:block;width:100%;height:auto}
.a-legend{display:flex;gap:12px;flex-wrap:wrap;padding:6px 4px 0;font-size:10.5px}
.a-legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:4px}
.a-ch-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.a-ch-head b{font-size:14px}
.a-ch-head span{font-size:11px;color:#a3a3a3}

/* A：白底 · 蓝框 */
.cardA{background:#fff;padding:20px 18px 16px}
.a-brand{font-size:12px;color:#4680FD;font-weight:700;letter-spacing:.02em}
.a-title{font-size:23px;font-weight:700;letter-spacing:-.02em;margin-top:7px}
.a-idx{font-size:12px;color:#767676;margin-top:7px}
.a-asof{font-size:11px;color:#a3a3a3;margin-top:2px}
.a-blue{position:relative;overflow:hidden;margin-top:14px;border:1px solid #E3EBFC;border-radius:10px;padding:16px}
.a-blue::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 0%,rgba(70,128,253,.11),rgba(70,128,253,0) 42%),radial-gradient(circle at 88% 100%,rgba(70,128,253,.09),rgba(70,128,253,0) 46%),linear-gradient(135deg,#FBFCFE,#F0F5FF)}
.a-blue>*{position:relative}
.a-top{display:flex;gap:14px;align-items:flex-start}
.a-score{flex:0 0 92px}
.a-big{font-size:42px;font-weight:700;line-height:1.05;letter-spacing:-.03em;color:#059661;margin-top:4px;white-space:nowrap}
.a-big small{font-size:12px;color:#8b8b8b;font-weight:400;margin-left:2px}
.a-chip{display:block;margin-top:6px;font-size:11px;font-weight:700;color:#059661}
.a-cols{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.a-v{font-size:16px;font-weight:700;margin-top:2px}
.a-note{font-size:11.5px;color:#404040;line-height:1.6;margin-top:4px}
.a-cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(70,128,253,.16)}
.a-cmp small{font-size:10.5px;color:#8b8b8b;display:block}
.a-cmp b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.a-chart{margin-top:16px;border:1px solid rgba(0,0,0,.06);border-radius:10px;padding:12px 10px 8px}
.a-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:12px}
.a-qrtext{flex:1;font-size:12px;color:#767676;line-height:1.6}
.a-qrtext b{display:block;font-size:13px;color:#111}
.a-qr{width:78px;height:78px;border:1px solid rgba(0,0,0,.08);border-radius:8px;padding:5px;background:#fff}

/* B：品牌蓝渐变头 */
.cardB{background:#fff}
.b-hero{background:linear-gradient(150deg,#2E5BFF,#4680FD 58%,#6C9BFF);color:#fff;padding:20px 18px 18px}
.b-brand{font-size:11.5px;opacity:.85;letter-spacing:.06em}
.b-title{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.02em}
.b-idx{font-size:12px;opacity:.9;margin-top:8px}
.b-asof{font-size:11px;opacity:.72;margin-top:2px}
.b-score{margin-top:14px;display:flex;align-items:flex-end;gap:10px}
.b-big{font-size:54px;font-weight:700;line-height:.95;letter-spacing:-.03em}
.b-big small{font-size:13px;font-weight:400;opacity:.8;margin-left:3px}
.b-chip{font-size:11.5px;font-weight:700;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:4px 10px;white-space:nowrap;margin-bottom:6px}
.b-body{background:#fff;padding:16px 18px 18px;flex:1;display:flex;flex-direction:column}
.b-card{border:1px solid rgba(70,128,253,.18);background:#F7FAFF;border-radius:10px;padding:13px 14px}
.b-two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.b-two>div{padding-right:12px}
.b-two>div+div{padding-left:14px;padding-right:0;border-left:1px solid rgba(70,128,253,.18)}
.b-v{font-size:16px;font-weight:700;margin-top:3px}
.b-note{font-size:11px;color:#404040;line-height:1.55;margin-top:5px}
.b-cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;text-align:center}
.b-cmp div{background:#F4F7FE;border-radius:8px;padding:8px 4px}
.b-cmp small{font-size:10.5px;color:#8b8b8b;display:block}
.b-cmp b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.b-chart{margin-top:14px;border:1px solid rgba(0,0,0,.06);border-radius:10px;padding:12px 10px 8px}
.b-foot{margin-top:auto;padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.b-qr{width:96px;height:96px;padding:6px;background:#fff;border:1px solid rgba(70,128,253,.25);border-radius:10px}
.b-foot p{font-size:11.5px;color:#767676}
.b-foot b{color:#2E5BFF}

/* C：深色夜间 · 仪表盘 */
.cardC{background:linear-gradient(170deg,#0E1726,#132442 60%,#0F1C31);color:#e8eef8;padding:20px 18px 16px}
.c-brand{font-size:11.5px;color:#7d9bd4;letter-spacing:.06em}
.c-title{font-size:22px;font-weight:700;margin-top:6px}
.c-idx{font-size:12px;color:#9fb4d8;margin-top:8px}
.c-asof{font-size:11px;color:#6f86ab;margin-top:2px}
.c-score{margin-top:14px;border:1px solid rgba(76,194,255,.28);border-radius:12px;padding:14px 16px;background:linear-gradient(150deg,rgba(76,194,255,.12),rgba(76,194,255,.02))}
.c-big{font-size:46px;font-weight:700;line-height:1;letter-spacing:-.03em;color:#4CC2FF;text-shadow:0 0 18px rgba(76,194,255,.35)}
.c-big small{font-size:12px;color:#7d90b0;font-weight:400;margin-left:3px;text-shadow:none}
.c-chip{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:#43d6a0;border:1px solid rgba(67,214,160,.4);border-radius:999px;padding:3px 10px}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.c-cell{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px}
.c-v{font-size:15px;font-weight:700;margin-top:3px}
.c-note{font-size:11px;color:#9fb4d8;line-height:1.55;margin-top:4px}
.c-cmp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}

.c-cmp b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

.c-ch-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 6px}
.c-ch-head b{font-size:14px;color:#e8eef8}
.c-ch-head span{font-size:11px;color:#6f86ab}
.c-foot{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:12px}
.c-qrtext{flex:1;font-size:11.5px;color:#9fb4d8;line-height:1.6}
.c-qrtext b{display:block;font-size:13px;color:#e8eef8}
.c-qr{width:78px;height:78px;border-radius:8px;padding:5px;background:#fff}
</style></head>
